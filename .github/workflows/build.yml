name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','*.swift','package.json','capacitor.config.json','.github/workflows/build.yml']
concurrency:
  group: build-ipa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create VLC plugin package
        run: |
          mkdir -p vyro-vlc/ios/Sources/VyroVlcPlugin
          cp VyroVlcPlugin.swift VyroPlayerViewController.swift vyro-vlc/ios/Sources/VyroVlcPlugin/
          cat > vyro-vlc/package.json <<'EOF2'
          {
            "name": "vyro-vlc",
            "version": "1.0.0",
            "capacitor": { "ios": { "src": "ios" } }
          }
          EOF2
          cat > vyro-vlc/VyroVlc.podspec <<'EOF2'
          require 'json'
          package = JSON.parse(File.read(File.join(__dir__, 'package.json')))
          Pod::Spec.new do |s|
            s.name = 'VyroVlc'
            s.version = package['version']
            s.summary = 'VYRO native VLC player'
            s.license = 'MIT'
            s.homepage = 'https://example.com'
            s.author = 'VYRO'
            s.source = { :git => 'https://example.com/vyro-vlc.git', :tag => s.version.to_s }
            s.source_files = 'ios/Sources/**/*.{swift,h,m}'
            s.ios.deployment_target = '14.0'
            s.dependency 'Capacitor'
            s.dependency 'MobileVLCKit', '~> 3.6.0'
            s.swift_version = '5.1'
          end
          EOF2
      - name: Prepare web app and iOS project
        run: |
          mkdir www && cp index.html www/
          npm install
          npm install ./vyro-vlc
          npx cap add ios
          npx cap sync ios
          cat ios/App/Podfile
      - name: Allow http playlist servers
        run: /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist
      - name: Build unsigned IPA
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr VYRO.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: VYRO-ipa, path: ios/App/VYRO.ipa }
      - name: Publish release and update source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          V=$(grep -o 'VYRO [0-9][0-9.]* · Metadata' index.html | head -1 | awk '{print $2}')
          SIZE=$(stat -f%z ios/App/VYRO.ipa)
          export V SIZE REPO
          python3 - <<'PY'
          import json,os,datetime
          repo=os.environ['REPO'];v=os.environ['V'];size=int(os.environ['SIZE'])
          base=f"https://github.com/{repo}/releases/download/latest/VYRO.ipa"
          icon=f"https://raw.githubusercontent.com/{repo}/main/icon.png"
          date=datetime.datetime.utcnow().strftime('%Y-%m-%d')
          desc="A sleek movie and series player for your Xtream or M3U playlist, with TMDB artwork, resume, and a built-in player for MKV."
          app={"name":"VYRO","bundleIdentifier":"com.vyro.app","developerName":"VYRO","subtitle":"Your movies and series","localizedDescription":desc,"iconURL":icon,"tintColor":"8b7bff","screenshotURLs":[],
               "version":v,"versionDate":date,"downloadURL":base,"size":size,
               "versions":[{"version":v,"date":date,"localizedDescription":"Latest build","downloadURL":base,"size":size}]}
          json.dump({"name":"VYRO","identifier":"com.vyro.source","subtitle":"Latest VYRO builds","iconURL":icon,"apps":[app],"news":[]},open("altstore.json","w"),indent=2)
          PY
          gh release delete latest --yes --cleanup-tag --repo "$REPO" || true
          gh release create latest ios/App/VYRO.ipa altstore.json --repo "$REPO" --title "VYRO $V" --notes "Latest build. Install link: https://github.com/$REPO/releases/download/latest/VYRO.ipa" --latest
