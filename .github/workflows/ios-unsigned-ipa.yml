
name: VYRO iOS IPA Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MKV playback files (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f install-mkv-support.sh ]; then
            echo "::error::install-mkv-support.sh is missing from this branch."
            exit 1
          fi
          bash install-mkv-support.sh
          test -f src/services/stream/StreamDetector.ts
          test -f src/services/plugins/AetherEngine.ts
          test -f src/services/plugins/AetherEngineWeb.ts
          test -f src/services/playback/PlaybackService.ts
          test -f src/composables/useVideoPlayer.ts
          test -f ios/App/App/AetherEnginePlugin.swift
          test -f .github/workflows/build-ios.yml
          echo "All seven installer output files verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate web app JavaScript and required controls
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          inline = [body for attrs, body in scripts if not re.search(r'\bsrc\s*=', attrs, re.I) and body.strip()]
          if not inline:
              raise SystemExit("No inline application script found")
          Path("/tmp/vyro-app.js").write_text("\n\n".join(inline), encoding="utf-8")

          required_ids = [
              "home", "discover", "mylist", "settings", "query", "kind", "sort",
              "results", "saved", "tmdbkey", "manifests", "savetmdb", "saveaddon",
              "testaddon", "savextream", "testxtream", "closedetail", "closeplayer",
              "detail", "player", "video", "streams"
          ]
          missing = [name for name in required_ids if not (re.search(r'\bid="' + re.escape(name) + r'"', html) or re.search(r"\bid='" + re.escape(name) + r"'", html))]
          if missing:
              raise SystemExit("Required app controls missing: " + ", ".join(missing))
          print("Extracted inline app JavaScript; required navigation, settings and playback controls are present.")
          PY
          node --check /tmp/vyro-app.js

      - name: Install dependencies
        run: npm install

      - name: Bundle local HLS.js asset
        run: npm run build

      - name: Run responsive layout and navigation smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node tests/layout-smoke.cjs
          node tests/streaming-reliability-smoke.cjs

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web app
        run: npx cap sync ios

      - name: Integrate native AetherEngine MKV player
        run: |
          gem install xcodeproj --no-document
          ruby scripts/integrate-native-player.rb

      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build IPHONEOS_DEPLOYMENT_TARGET=18.0 CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/

          # Normalize bundle permissions before archiving. Some third-party
          # framework binaries otherwise arrive without readable mode bits,
          # causing on-device signing tools to fail with EACCES.
          find Payload -type d -exec chmod 755 {} +
          find Payload -type f -exec chmod u+rw,go+r {} +

          # Preserve framework symlinks rather than dereferencing them.
          /usr/bin/zip -qry -y VYRO-unsigned.ipa Payload

          # Fail the build if the IPA archive does not contain the native
          # AetherEngine framework binary or if its archived mode is unreadable.
          python3 - <<'PY'
          import stat
          import zipfile

          ipa = "VYRO-unsigned.ipa"
          with zipfile.ZipFile(ipa) as archive:
              candidates = [
                  item for item in archive.infolist()
                  if item.filename.endswith("/AetherLibswresample")
                  and "/Frameworks/" in item.filename
              ]
              if not candidates:
                  raise SystemExit("AetherLibswresample framework binary missing from IPA")
              for item in candidates:
                  mode = (item.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit("AetherLibswresample unexpectedly archived as a symlink")
                  if mode and not (mode & stat.S_IRUSR):
                      raise SystemExit("AetherLibswresample is not owner-readable in IPA")
          print("IPA framework permissions verified.")
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-unsigned-IPA
          path: VYRO-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
