
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090e">
<title>VYRO Cinema</title>
<style>
:root{color-scheme:dark;--bg:#08090e;--panel:#13151e;--muted:#9b9eaf;--accent:#a78bfa;--white:#f7f7fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff0d;position:sticky;top:0;background:#08090eeb;backdrop-filter:blur(18px);z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:4px}.logo span{color:var(--accent)}
button,input{font:inherit}button{cursor:pointer}
.iconbtn{background:var(--panel);border:1px solid #ffffff12;border-radius:50%;width:40px;height:40px;color:white;font-size:18px}
main{max-width:1100px;margin:auto;padding:18px 18px 100px}
.hero{min-height:390px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(90deg,#090a12 0%,#090a12df 38%,#090a1240 100%),linear-gradient(0deg,#08090e 0%,transparent 60%),url('https://image.tmdb.org/t/p/w1280/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg') center/cover;display:flex;align-items:flex-end;padding:30px 25px;margin-bottom:30px}
.eyebrow{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.hero h1{font-size:clamp(34px,8vw,58px);line-height:1;margin:12px 0}
.hero p{max-width:440px;color:#d0d0dc;line-height:1.6;font-size:14px}
.meta{color:#c2c3d0;font-size:12px;margin:15px 0}
.primary{background:var(--white);color:#11121a;border:0;padding:13px 20px;border-radius:10px;font-weight:800}
.secondary{background:#ffffff14;color:white;border:1px solid #ffffff24;padding:12px 16px;border-radius:10px;margin-left:7px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.sectionhead h2{font-size:19px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px}
.movie{min-width:0;cursor:pointer}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:13px;background:#191a25;display:block;transition:transform .2s}
.movie:active .poster{transform:scale(.98)}
.movie h3{font-size:13px;margin:9px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--muted)}
.search{display:none;margin:15px 0}.search input{width:100%;padding:14px;background:var(--panel);border:1px solid #292b3a;border-radius:12px;color:white;outline:none}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0c0d14f5;border-top:1px solid #ffffff12;display:flex;justify-content:space-around;padding:10px 5px max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(20px)}
nav button{background:none;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:55px}
nav button b{font-size:20px;font-weight:400}nav button.active{color:var(--accent)}
.notice{display:none;margin:12px 0;padding:12px;background:#19152a;border:1px solid #44346a;border-radius:10px;color:#d9d0ff;font-size:13px}
@media(min-width:650px){main{padding-top:26px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 16px}.hero{min-height:450px;padding:40px}.hero p{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="logo">VYRO<span>.</span></div>
  <button class="iconbtn" id="searchBtn" aria-label="Search">⌕</button>
</header>
<main>
  <div class="search" id="searchBox">
    <input id="searchInput" placeholder="Search movies and series..." autocomplete="off">
  </div>
  <section class="hero">
    <div>
      <div class="eyebrow">VYRO Original Selection</div>
      <h1>Beyond<br>the Unknown.</h1>
      <div class="meta">2025 &nbsp; • &nbsp; Sci-Fi &nbsp; • &nbsp; 4K</div>
      <p>Explore a cinematic universe of unforgettable stories. Your next favourite starts here.</p>
      <button class="primary" onclick="notify('Playback is not connected yet. Add a legal streaming source to watch titles.')">▶ &nbsp; Watch now</button>
      <button class="secondary" onclick="notify('Featured title saved to your demo watchlist.')">＋ My list</button>
    </div>
  </section>

  <div class="sectionhead"><h2 id="sectionTitle">Trending now</h2><span>CURATED FOR YOU</span></div>
  <div class="grid" id="movieGrid"></div>
  <div class="empty" id="empty">No titles found. Try another search.</div>
  <div class="notice" id="notice"></div>
</main>

<nav>
  <button class="active" data-page="Home"><b>⌂</b>Home</button>
  <button data-page="Discover"><b>⌕</b>Discover</button>
  <button data-page="My List"><b>♡</b>My List</button>
  <button data-page="Series"><b>▣</b>Series</button>
  <button data-page="Profile"><b>◉</b>Profile</button>
</nav>

<script>
const movies=[
 {title:"Dune: Part Two",year:"2024",genre:"Sci-Fi",rating:"8.5",id:693134},
 {title:"The Batman",year:"2022",genre:"Action",rating:"7.8",id:414906},
 {title:"Interstellar",year:"2014",genre:"Sci-Fi",rating:"8.7",id:157336},
 {title:"Oppenheimer",year:"2023",genre:"Drama",rating:"8.1",id:872585},
 {title:"Spider-Man: Across the Spider-Verse",year:"2023",genre:"Animation",rating:"8.6",id:569094},
 {title:"Top Gun: Maverick",year:"2022",genre:"Action",rating:"8.2",id:361743},
 {title:"The Creator",year:"2023",genre:"Sci-Fi",rating:"7.0",id:670292},
 {title:"John Wick: Chapter 4",year:"2023",genre:"Action",rating:"7.7",id:603692}
];
let saved=[];
let page="Home";
const grid=document.getElementById("movieGrid");
const input=document.getElementById("searchInput");
const searchBox=document.getElementById("searchBox");
function poster(id){return "https://image.tmdb.org/t/p/w500/"+({693134:"1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg"}[id]||"");}
function render(){
 const q=input.value.toLowerCase().trim();
 let list=movies.filter(m=>(m.title+" "+m.genre).toLowerCase().includes(q));
 if(page==="My List") list=list.filter(m=>saved.includes(m.id));
 if(page==="Series") list=list.filter(m=>m.genre==="Sci-Fi"||m.genre==="Drama");
 document.getElementById("sectionTitle").textContent=page==="Home"?"Trending now":page;
 grid.innerHTML="";
 list.forEach(m=>{
  const el=document.createElement("article");el.className="movie";
  const img=document.createElement("img");img.className="poster";img.alt=m.title;img.loading="lazy";
  img.src="https://image.tmdb.org/t/p/w500"+posterPath(m.id);
  img.onerror=()=>{img.onerror=null;img.src="https://placehold.co/400x600/171824/e5e7eb?text="+encodeURIComponent(m.title)};
  const h=document.createElement("h3");h.textContent=m.title;
  const sub=document.createElement("div");sub.className="sub";sub.textContent=m.year+" • "+m.genre+" • ★ "+m.rating;
  el.append(img,h,sub);el.onclick=()=>details(m);grid.append(el);
 });
 document.getElementById("empty").style.display=list.length?"none":"block";
}
function posterPath(id){
 const paths={693134:"1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",414906:"74xTEgt7R36Fpooo50r9T25onhq.jpg",157336:"gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",872585:"ptpr0kGAckfQkJeJIt8st5dglvd.jpg",569094:"8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",361743:"62HCnUTziyWcpDaBO2i1DX17ljH.jpg",670292:"vBZ0qvaRxqEhZwl6LWmruJqWE8Z.jpg",603692:"vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"};
 return "/"+(paths[id]||"");
}
function details(m){notify(m.title+" ("+m.year+") • "+m.genre+" • ★ "+m.rating+". Playback requires a configured streaming provider.");}
function notify(message){const n=document.getElementById("notice");n.textContent=message;n.style.display="block";clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>n.style.display="none",4500);}
document.getElementById("searchBtn").onclick=()=>{searchBox.style.display=searchBox.style.display==="block"?"none":"block";if(searchBox.style.display==="block")input.focus();};
input.addEventListener("input",render);
document.querySelectorAll("nav button").forEach(btn=>btn.onclick=()=>{
 page=btn.dataset.page;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b===btn));
 if(page==="Discover"){searchBox.style.display="block";input.focus();}
 if(page==="Profile")notify("VYRO profile • Account sign-in is not configured in this prototype.");
 render();
});
render();
</script>
</body>
</html>
