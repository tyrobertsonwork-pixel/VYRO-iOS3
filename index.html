<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VYRO">
<title>VYRO</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#05060a;color:#f4f5fa;font:15px/1.4 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
body::before,body::after{content:'';position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px)}
body::before{top:-30vmax;left:-25vmax;background:#8b7bff;opacity:.28}body::after{bottom:-35vmax;right:-30vmax;background:#4de2c5;opacity:.16}
.glass,.btn,.input,.chip{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 40px rgba(0,0,0,.45)}
.page{padding-bottom:120px;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{padding:max(env(safe-area-inset-top),16px) 20px 0}
h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}h2{font-size:18px;font-weight:800;margin:28px 20px 12px}
.btn,.chip{display:inline-block;border-radius:99px;padding:12px 20px;font:800 14px inherit;color:inherit;text-decoration:none;border-width:1px}
.btn.p,.chip.on{background:#fff;color:#05060a}.btn:active{transform:scale(.95)}
.chip{padding:8px 16px;font-size:12px;margin-right:8px;flex:none}
.input{width:100%;border-radius:18px;padding:14px 16px;color:#fff;font:inherit;outline:0;margin:6px 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.pos{flex:none;width:128px;position:relative;display:block}.grid .pos{width:auto}
.pos img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;background:#111;display:block;border:1px solid rgba(255,255,255,.14)}
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:9px;background:rgba(255,255,255,.3)}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}
.hero{position:relative;height:66vh}.hero>img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#05060a,rgba(5,6,10,.2) 60%,transparent)}
.hero .tx{position:absolute;z-index:1;left:20px;right:20px;bottom:16px}.hero h1{font-size:38px}
.dim{color:rgba(255,255,255,.6);font-size:13px}.card{border-radius:26px;padding:20px;margin:16px 20px}
nav{position:fixed;left:16px;right:16px;bottom:max(env(safe-area-inset-bottom),12px);z-index:9;display:flex;border-radius:99px;padding:6px}
body.bare nav{display:none}nav a{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-size:10px;font-weight:800;color:rgba(255,255,255,.5);text-decoration:none}
nav a svg{display:block;margin:0 auto 2px;width:20px;height:20px;fill:currentColor}nav a.on{background:rgba(255,255,255,.15);color:#fff}
.back{position:absolute;z-index:2;left:16px;top:max(env(safe-area-inset-top),16px);padding:8px 16px}
#pl{position:fixed;inset:0;background:#000;z-index:20}#pl video{width:100%;height:100%}
.logo{font-size:76px;font-weight:800;letter-spacing:-.06em;background:linear-gradient(135deg,#fff,#8b7bff 55%,#4de2c5);-webkit-background-clip:text;color:transparent;animation:in 1s}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.err{color:#fca5a5;font-size:13px;margin-bottom:10px}.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)}
.pc{position:absolute;top:max(env(safe-area-inset-top),16px);right:12px;display:flex;border-radius:99px;padding:3px}.pc a{padding:8px 10px;font-weight:800;font-size:12px;border-radius:99px}.pc a:active{background:rgba(255,255,255,.2)}
details{margin:0 20px 10px;border-radius:18px;padding:4px 14px}summary{padding:10px 0;font-weight:800}.ep{display:block;padding:10px 0;color:#fff;text-decoration:none;border-top:1px solid rgba(255,255,255,.1);position:relative}.ep .bar{left:0;right:0;bottom:2px}
select.input{appearance:none}
/* v1.2 polish */
.btn,.chip{font-family:inherit;font-weight:800;font-size:14px;letter-spacing:-.01em;line-height:1.2}
.chip{font-size:12px;padding:8px 14px}
.glass,.btn,.input,.chip,nav{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 24px rgba(0,0,0,.35)}
#app{max-width:760px;margin:0 auto}nav{max-width:520px;margin:0 auto}
h2{font-size:17px;margin:30px 20px 12px;letter-spacing:-.02em}
.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.pos{width:122px}.grid .pos{width:auto}
.pi{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.pi::before{content:attr(data-t);font-size:11px;font-weight:700;color:rgba(255,255,255,.4)}
.pi img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;border:0;border-radius:0;background:none}
.cap{font-size:12px;font-weight:700;margin-top:6px;line-height:1.25;color:rgba(255,255,255,.85);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero{height:62dvh}.hero .tx{text-shadow:0 2px 20px rgba(0,0,0,.55)}.ob{min-height:100dvh}
.sk{height:60dvh;margin:20px;border-radius:24px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
#pl video{object-fit:contain;background:#000}
.pos{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.in{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(77,226,197,.95);color:#05060a;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:1}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:in .2s}
.sheet>div{width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:15px;margin-bottom:6px}.sheet a{display:block;padding:14px 2px;font-weight:700;border-top:1px solid rgba(255,255,255,.1)}
.cast{width:76px;flex:none;text-align:center;font-size:11px;font-weight:700;line-height:1.25}.cast img,.cast i{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:rgba(255,255,255,.08)}
.btn{margin-bottom:8px}
</style></head><body>
<div id="app"></div>
<nav class="glass" id="nav"></nav>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF='https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',ST=['kv','wl','pr'];
const S={key:'',tpl:DEF,wl:[],pr:{},lib:{items:[],t:0},src:null,hideAdult:true,pls:[],act:'',pin:''},D={type:'movie',g:null};let cur=null,after=null;
/* IndexedDB */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('vyro',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const q=f(d.transaction(s,m).objectStore(s));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const DB={get:(s,k)=>tx(s,'readonly',o=>o.get(k)),set:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)).catch(()=>{}),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)).catch(()=>{}),all:s=>tx(s,'readonly',o=>o.getAll()),clear:s=>tx(s,'readwrite',o=>o.clear())};
DB.entries=s=>open().then(d=>new Promise((res,rej)=>{const o=[],q=d.transaction(s).objectStore(s).openCursor();q.onsuccess=()=>{const c=q.result;if(c){o.push([c.key,c.value]);c.continue()}else res(o)};q.onerror=()=>rej(q.error)}));
const K=(t,i)=>t+':'+i;
/* TMDB */
const api=async(p,q={},key=S.key)=>{const u=new URL('https://api.themoviedb.org/3'+p);u.searchParams.set('api_key',key);for(const k in q)if(q[k]!=null)u.searchParams.set(k,q[k]);const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const norm=(r,t)=>({id:r.id,type:r.media_type||t,title:r.title||r.name||'',poster:r.poster_path,backdrop:r.backdrop_path,overview:r.overview||'',rating:r.vote_average||0,year:(r.release_date||r.first_air_date||'').slice(0,4)});
const list=async(p,t,q)=>(await api(p,q)).results.map(r=>norm(r,t)).filter(i=>(i.type=='movie'||i.type=='tv')&&i.poster);
const img=(p,s='w342')=>p?(p[0]=='h'?p:`https://image.tmdb.org/t/p/${s}${p}`):'';
/* UI bits */
const PI={};let pic=0;
const pos=(i,to,pct,cap,pk)=>{const id=++pic;PI[id]={i,pk};const m=i.type!='pl'&&match(i);return `<a class="pos" data-pi="${id}" href="${to||i.href||`#/title/${i.type}/${i.id}`}"><div class="pi" data-t="${esc(i.title)}">${m?'<span class="in">✓</span>':''}<img loading="lazy" src="${img(i.poster)}" alt="" onerror="this.remove()">${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div>${cap?`<div class="cap">${esc(i.title)}</div>`:''}</a>`};
const row=(t,items)=>items.length?`<h2>${t}</h2><div class="row">${items.map(i=>pos(i)).join('')}</div>`:'';
const grid=(items,empty)=>items.length?`<div class="grid">${items.map(i=>pos(i,null,null,1)).join('')}</div>`:`<p class="empty">${empty}</p>`;
const tabs=[['','Home','M4 11l8-7 8 7v9h-5v-6H9v6H4z'],['discover','Discover','M12 3a9 9 0 100 18 9 9 0 000-18zm3.5 5.5l-2 5-5 2 2-5z'],['search','Search','M10 4a6 6 0 104 10.5l5 5 1.5-1.5-5-5A6 6 0 0010 4z'],['library','Library','M5 4h14v16l-7-4-7 4z'],['settings','Settings','M12 8a4 4 0 100 8 4 4 0 000-8zM11 2h2l.5 3 2 1 2.5-1.7 1.400 1.400L18 8.500l1 2 3 .5v2l-3 .5-1 2 1.700 2.500-1.400 1.400-2.500-1.700-2 1-.5 3h-2l-.5-3-2-1-2.500 1.700-1.400-1.400L6 15.500l-1-2-3-.5v-2l3-.5 1-2-1.700-2.500 1.400-1.400L8.500 6l2-1z']];
$('#nav').innerHTML=tabs.map(([h,l,d])=>`<a href="#/${h}" data-h="${h}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</a>`).join('');
/* Views */
const V={
async home(){
  const [tr,mp,mt,tp,tt]=await Promise.all([list('/trending/all/week'),list('/movie/popular','movie'),list('/movie/top_rated','movie'),list('/tv/popular','tv'),list('/tv/top_rated','tv')]);
  const h=tr.find(x=>match(x))||tr[0],c=Object.entries(S.pr).filter(([k,p])=>p.t>10&&p.t<p.d-30).sort((a,b)=>b[1].u-a[1].u);
  const pl=S.lib.items.filter(x=>!(S.hideAdult&&ADULT.test(x.cat))),rec=k=>pl.filter(x=>x.kind==k).sort((a,b)=>b.added-a.added).slice(0,20);
  const cats={};pl.forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>row(k,pl.filter(x=>x.cat==k).sort((a,b)=>b.rating-a.rating||b.added-a.added).slice(0,20))).join('');
  return `<div class="hero"><img src="${img(h.backdrop||h.poster,'w780')}" alt=""><div class="tx"><h1>${esc(h.title)}</h1><p class="dim" style="margin:8px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(h.overview)}</p>${playBtn(h,1)} <a class="btn" href="#/title/${h.type}/${h.id}">Details</a></div></div>`
   +(c.length?`<h2>Continue watching</h2><div class="row">${c.map(([k,p])=>pos(p.item,p.item.href||`#/watch/${p.item.type}/${p.item.id}`,p.t/p.d*100,0,k)).join('')}</div>`:'')
   +row('New movies in your playlist',rec('movie'))+row('New series in your playlist',rec('series'))+top
   +row('Trending',tr.slice(1))+row('Popular movies',mp)+row('Top rated movies',mt)+row('Popular series',tp)+row('Top rated series',tt);
},
async discover(){
  D.sort2=D.sort2||'pop';const today=new Date().toISOString().slice(0,10),mv=D.type=='movie';
  const p={with_genres:D.g,sort_by:{pop:'popularity.desc',top:'vote_average.desc',new:mv?'primary_release_date.desc':'first_air_date.desc'}[D.sort2]};
  if(D.sort2=='top')p['vote_count.gte']=300;
  if(D.sort2=='new'){p[mv?'primary_release_date.lte':'first_air_date.lte']=today;p['vote_count.gte']=20}
  const pages=Math.max(1,D.pg||1);
  const [gs,...rs]=await Promise.all([api(`/genre/${D.type}/list`),...Array.from({length:pages},(_,i)=>list(`/discover/${D.type}`,D.type,{...p,page:i+1}))]);
  const seen=new Set();let items=rs.flat().filter(x=>!seen.has(x.id)&&seen.add(x.id));
  if(D.mine)items=items.filter(x=>match(x));
  const ch=(on,fn,l)=>`<a class="chip ${on?'on':''}" onclick="${fn}">${esc(l)}</a>`;
  return `<div class="top"><h1>Discover</h1><div style="margin:16px 0 8px">${['movie','tv'].map(t=>ch(D.type==t,`setD('${t}')`,t=='tv'?'Series':'Movies')).join('')}</div><div class="row" style="padding:0 0 8px">${[['pop','Popular'],['top','Top rated'],['new','Newest']].map(([v,l])=>ch(D.sort2==v,`setSort('${v}')`,l)).join('')}${S.lib.items.length?ch(D.mine,'tgMine()','In my playlist'):''}</div><div class="row" style="padding:0 0 16px">${gs.genres.map(g=>ch(D.g==g.id,`setG(${g.id})`,g.name)).join('')}</div></div>${grid(items,D.mine?'Nothing here is in your playlist yet. Try Show more.':'Nothing found.')}<p style="text-align:center;margin-top:18px"><a class="btn" onclick="D.pg=(D.pg||1)+1;route()">Show more</a></p>`;
},
async search(){after=()=>$('#q').focus();return `<div class="top"><input id="q" class="input" placeholder="Movies, series" oninput="doSearch(this.value)"></div><div id="res"><p class="empty">Search by title to find something to watch.</p></div>`},
async title(t,id){
  const d=await api(`/${t}/${id}`,{append_to_response:'similar,credits,videos'}),i=cur=norm(d,t),sv=S.wl.some(w=>w.id==i.id&&w.type==i.type);
  const meta=[i.year,'★ '+i.rating.toFixed(1),(d.runtime||d.episode_run_time?.[0])?(d.runtime||d.episode_run_time[0])+' min':'',d.number_of_seasons?d.number_of_seasons+' seasons':''].filter(Boolean).join('  ·  ');
  return `<div class="hero" style="height:55vh"><img src="${img(i.backdrop||i.poster,'w780')}" alt=""><a class="btn back" href="javascript:history.back()">Back</a></div><div style="position:relative;z-index:1;margin-top:-60px;padding:0 20px"><h1 style="font-size:38px">${esc(i.title)}</h1><p class="dim" style="margin:8px 0">${meta}</p><div style="margin:12px 0 18px">${d.genres.map(g=>`<span class="chip" style="cursor:default">${esc(g.name)}</span>`).join('')}</div>${playBtn(i)} <a class="btn" onclick="toggle()">${sv?'Remove from list':'Add to list'}</a> ${trailer(d)}<p style="margin-top:18px;color:rgba(255,255,255,.75)">${esc(i.overview)}</p></div>`+castRow(d)+row('More like this',d.similar.results.map(r=>norm(r,t)).filter(x=>x.poster));
},
async library(){
  const t=D.lib||'w',body=t=='p'?(S.lib.items.length?plView():`<p class="empty">No playlist yet.<br><br><a class="btn p" href="#/settings">Add playlist</a></p>`):grid(t=='w'?S.wl:Object.values(S.pr).sort((a,b)=>b.u-a.u).map(p=>p.item),t=='w'?'Your watchlist is empty. Tap “Add to list” on any title.':'Nothing watched yet.');
  return `<div class="top"><h1>Library</h1><div style="margin:16px 0">${[['w','Watchlist'],['h','History'],['p','Playlist']].map(([k,l])=>`<a class="chip ${t==k?'on':''}" onclick="D.lib='${k}';route()">${l}</a>`).join('')}</div></div>${body}`;
},
async settings(){const n=k=>S.lib.items.filter(x=>x.kind==k).length;
return `<div class="top"><h1>Settings</h1></div><h2>Playlists</h2><div class="glass card" style="margin-top:0">${S.pls.length?`<div class="row" style="padding:0 0 12px">${S.pls.map(p=>`<a class="chip ${p.id==S.act?'on':''}" onclick="switchPl('${p.id}')">${esc(p.name)}</a>`).join('')}</div><p id="sm" class="dim" style="margin-bottom:12px">${S.lib.items.length?`${n('movie')} movies · ${n('series')} series · synced ${new Date(S.lib.t).toLocaleDateString()}`:'Not synced yet.'}</p><a class="btn p" onclick="resync(this)">Re-sync</a> <a class="btn" style="color:#fca5a5" onclick="rmPl()">Remove</a>`:`<p id="sm" class="dim">No playlist yet. Add one below.</p>`}</div>
<h2>Add a playlist</h2><div class="glass card" style="margin-top:0"><p class="dim" style="margin-bottom:10px">Movies and series only. Live channels are ignored.</p><input id="pn" class="input" placeholder="Name, e.g. Home"><select id="st" class="input" onchange="$('#xf').style.display=this.value=='xtream'?'block':'none';$('#mf').style.display=this.value=='xtream'?'none':'block'"><option value="xtream">Xtream Codes login</option><option value="m3u">M3U playlist URL</option></select><div id="xf"><input id="sv" class="input" placeholder="Server, e.g. https://host:8080"><input id="us" class="input" placeholder="Username"><input id="pw" class="input" type="password" placeholder="Password"></div><div id="mf" style="display:none"><input id="ul" class="input" placeholder="https://…/playlist.m3u"></div><a class="btn p" onclick="addSrc(this)">Add and sync</a></div>
<h2>Parental controls</h2><div class="glass card" style="margin-top:0"><p class="dim" style="margin-bottom:10px">Adult categories are hidden everywhere. A PIN is needed to show them.</p><a class="chip" onclick="tgAdult()">${S.hideAdult?'Adult categories hidden':'Adult categories shown'}</a><a class="chip" onclick="setPin()">${S.pin?'Change or remove PIN':'Set PIN'}</a></div>
<h2>Player</h2><div class="glass card" style="margin-top:0">${VLC()?`<p class="dim" style="margin-bottom:10px">Built-in player plays MKV, AVI, TS and more, with audio and subtitle tracks.</p><p id="vs" class="dim" style="margin-bottom:10px">${Capacitor.isPluginAvailable('VyroVlc')?'Status: ready':'Status: not found in this build'}</p><a class="chip" onclick="testVlc()">Test built-in player</a>${[['auto','Auto'],['always','Always built-in']].map(([k,l])=>`<a class="chip ${(S.vlc||'auto')==k?'on':''}" onclick="S.vlc='${k}';DB.set('kv','vlc',k);route()">${l}</a>`).join('')}`:`<p class="dim">The built-in player (MKV, AVI, subtitles, audio tracks) is only in the iPhone app version. The web version plays MP4 and HLS.</p>`}</div>
<h2>TMDB</h2><div class="glass card" style="margin-top:0"><p class="dim">API key (v3)</p><input id="k" class="input" value="${esc(S.key)}"><p class="dim">Fallback stream URL template</p><input id="t" class="input" value="${esc(S.tpl)}"><a class="btn p" onclick="saveSet(this)">Save changes</a></div><div style="padding:0 20px"><a class="btn" style="color:#fca5a5" onclick="wipe()">Erase all local data</a><p class="dim" style="text-align:center;margin-top:24px">VYRO 1.5 · Metadata by TMDB</p></div>`},
async onboarding(){return `<div class="ob"><div class="logo">VYRO</div><p class="dim" style="margin:8px 0 28px;max-width:280px">Connect your TMDB account to fill the app with movies and shows.</p><div class="glass card" style="margin:0"><input id="k" class="input" placeholder="TMDB API key (v3)" autocapitalize="off" autocorrect="off"><div id="e" class="err"></div><a class="btn p" style="width:100%;text-align:center" onclick="connect(this)">Connect TMDB</a><p style="margin-top:14px;text-align:center"><a class="dim" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Get a free key at themoviedb.org</a></p></div></div>`},
async watch(t,id){const i=norm(await api(`/${t}/${id}`),t);return player(S.tpl.replace('{type}',t).replace('{id}',id).replace('{season}',1).replace('{episode}',1),K(t,id),{...i,href:`#/watch/${t}/${id}`},null)},
async pl(k){
