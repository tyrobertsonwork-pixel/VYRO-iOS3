<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>VYRO</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#05060a;color:#f4f5fa;font:15px/1.4 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
body::before,body::after{content:'';position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px)}
body::before{top:-30vmax;left:-25vmax;background:#8b7bff;opacity:.28}body::after{bottom:-35vmax;right:-30vmax;background:#4de2c5;opacity:.16}
.glass,.btn,.input,.chip{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 40px rgba(0,0,0,.45)}
.page{padding-bottom:120px;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{padding:max(env(safe-area-inset-top),16px) 20px 0}
h1{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}h2{font-size:18px;font-weight:800;margin:28px 20px 12px}
.btn,.chip{display:inline-block;border-radius:99px;padding:12px 20px;font:800 14px inherit;color:inherit;text-decoration:none;border-width:1px}
.btn.p,.chip.on{background:#fff;color:#05060a}.btn:active{transform:scale(.95)}
.chip{padding:8px 16px;font-size:12px;margin-right:8px;flex:none}
.input{width:100%;border-radius:18px;padding:14px 16px;color:#fff;font:inherit;outline:0;margin:6px 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.pos{flex:none;width:128px;position:relative;display:block}.grid .pos{width:auto}
.pos img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;background:#111;display:block;border:1px solid rgba(255,255,255,.14)}
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:9px;background:rgba(255,255,255,.3)}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}
.hero{position:relative;height:66vh}.hero>img{width:100%;height:100%;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,#05060a,rgba(5,6,10,.2) 60%,transparent)}
.hero .tx{position:absolute;z-index:1;left:20px;right:20px;bottom:16px}.hero h1{font-size:38px}
.dim{color:rgba(255,255,255,.6);font-size:13px}.card{border-radius:26px;padding:20px;margin:16px 20px}
nav{position:fixed;left:16px;right:16px;bottom:max(env(safe-area-inset-bottom),12px);z-index:9;display:flex;border-radius:99px;padding:6px}
body.bare nav{display:none}nav a{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-size:10px;font-weight:800;color:rgba(255,255,255,.5);text-decoration:none}
nav a svg{display:block;margin:0 auto 2px;width:20px;height:20px;fill:currentColor}nav a.on{background:rgba(255,255,255,.15);color:#fff}
.back{position:absolute;z-index:2;left:16px;top:max(env(safe-area-inset-top),16px);padding:8px 16px}
#pl{position:fixed;inset:0;background:#000;z-index:20}#pl video{width:100%;height:100%}
.logo{font-size:76px;font-weight:800;letter-spacing:-.06em;background:linear-gradient(135deg,#fff,#8b7bff 55%,#4de2c5);-webkit-background-clip:text;color:transparent;animation:in 1s}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.err{color:#fca5a5;font-size:13px;margin-bottom:10px}.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.5)}
.pc{position:absolute;top:max(env(safe-area-inset-top),16px);right:12px;display:flex;border-radius:99px;padding:3px}.pc a{padding:8px 10px;font-weight:800;font-size:12px;border-radius:99px}.pc a:active{background:rgba(255,255,255,.2)}
details{margin:0 20px 10px;border-radius:18px;padding:4px 14px}summary{padding:10px 0;font-weight:800}.ep{display:block;padding:10px 0;color:#fff;text-decoration:none;border-top:1px solid rgba(255,255,255,.1);position:relative}.ep .bar{left:0;right:0;bottom:2px}
select.input{appearance:none}</style></head><body>
<div id="app"></div>
<nav class="glass" id="nav"></nav>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF='https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',ST=['kv','wl','pr'];
const S={key:'',tpl:DEF,wl:[],pr:{},lib:{items:[],t:0},src:null,hideAdult:true},D={type:'movie',g:null};let cur=null,after=null;
/* IndexedDB */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('vyro',1);r.onupgradeneeded=()=>ST.forEach(s=>r.result.createObjectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const q=f(d.transaction(s,m).objectStore(s));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const DB={get:(s,k)=>tx(s,'readonly',o=>o.get(k)),set:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)).catch(()=>{}),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)).catch(()=>{}),all:s=>tx(s,'readonly',o=>o.getAll()),clear:s=>tx(s,'readwrite',o=>o.clear())};
const K=(t,i)=>t+':'+i;
/* TMDB */
const api=async(p,q={},key=S.key)=>{const u=new URL('https://api.themoviedb.org/3'+p);u.searchParams.set('api_key',key);for(const k in q)if(q[k]!=null)u.searchParams.set(k,q[k]);const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const norm=(r,t)=>({id:r.id,type:r.media_type||t,title:r.title||r.name||'',poster:r.poster_path,backdrop:r.backdrop_path,overview:r.overview||'',rating:r.vote_average||0,year:(r.release_date||r.first_air_date||'').slice(0,4)});
const list=async(p,t,q)=>(await api(p,q)).results.map(r=>norm(r,t)).filter(i=>(i.type=='movie'||i.type=='tv')&&i.poster);
const img=(p,s='w342')=>p?(p[0]=='h'?p:`https://image.tmdb.org/t/p/${s}${p}`):'';
/* UI bits */
const pos=(i,to,pct)=>`<a class="pos" href="${to||i.href||`#/title/${i.type}/${i.id}`}"><img loading="lazy" src="${img(i.poster)}" alt="${esc(i.title)}">${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</a>`;
const row=(t,items)=>items.length?`<h2>${t}</h2><div class="row">${items.map(i=>pos(i)).join('')}</div>`:'';
const grid=(items,empty)=>items.length?`<div class="grid">${items.map(i=>pos(i)).join('')}</div>`:`<p class="empty">${empty}</p>`;
const tabs=[['','Home','M4 11l8-7 8 7v9h-5v-6H9v6H4z'],['discover','Discover','M12 3a9 9 0 100 18 9 9 0 000-18zm3.5 5.5l-2 5-5 2 2-5z'],['search','Search','M10 4a6 6 0 104 10.5l5 5 1.5-1.5-5-5A6 6 0 0010 4z'],['library','Library','M5 4h14v16l-7-4-7 4z'],['settings','Settings','M12 8a4 4 0 100 8 4 4 0 000-8zM11 2h2l.5 3 2 1 2.5-1.7 1.400 1.400L18 8.500l1 2 3 .5v2l-3 .5-1 2 1.700 2.500-1.400 1.400-2.500-1.700-2 1-.5 3h-2l-.5-3-2-1-2.500 1.700-1.400-1.400L6 15.500l-1-2-3-.5v-2l3-.5 1-2-1.700-2.500 1.400-1.400L8.500 6l2-1z']];
$('#nav').innerHTML=tabs.map(([h,l,d])=>`<a href="#/${h}" data-h="${h}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${l}</a>`).join('');
/* Views */
const V={
async home(){
  const [tr,mp,mt,tp,tt]=await Promise.all([list('/trending/all/week'),list('/movie/popular','movie'),list('/movie/top_rated','movie'),list('/tv/popular','tv'),list('/tv/top_rated','tv')]);
  const h=tr[0],c=Object.values(S.pr).filter(p=>p.t>10&&p.t<p.d-30).sort((a,b)=>b.u-a.u);
  return `<div class="hero"><img src="${img(h.backdrop||h.poster,'w780')}" alt=""><div class="tx"><h1>${esc(h.title)}</h1><p class="dim" style="margin:8px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(h.overview)}</p>${playBtn(h)} <a class="btn" href="#/title/${h.type}/${h.id}">Details</a></div></div>`
   +(c.length?`<h2>Continue watching</h2><div class="row">${c.map(p=>pos(p.item,p.item.href||`#/watch/${p.item.type}/${p.item.id}`,p.t/p.d*100)).join('')}</div>`:'')
   +row('From your playlist',[...S.lib.items].sort((a,b)=>b.added-a.added).slice(0,20))+row('Trending',tr.slice(1))+row('Popular movies',mp)+row('Top rated movies',mt)+row('Popular series',tp)+row('Top rated series',tt);
},
async discover(){
  const [gs,items]=await Promise.all([api(`/genre/${D.type}/list`),list(`/discover/${D.type}`,D.type,{with_genres:D.g,sort_by:'popularity.desc'})]);
  return `<div class="top"><h1>Discover</h1><div style="margin:16px 0 12px">${['movie','tv'].map(t=>`<a class="chip ${D.type==t?'on':''}" onclick="setD('${t}')">${t=='tv'?'Series':'Movies'}</a>`).join('')}</div><div class="row" style="padding:0 0 16px">${gs.genres.map(g=>`<a class="chip ${D.g==g.id?'on':''}" onclick="setG(${g.id})">${esc(g.name)}</a>`).join('')}</div></div>${grid(items,'Nothing found.')}`;
},
async search(){after=()=>$('#q').focus();return `<div class="top"><input id="q" class="input" placeholder="Movies, series" oninput="doSearch(this.value)"></div><div id="res"><p class="empty">Search by title to find something to watch.</p></div>`},
async title(t,id){
  const d=await api(`/${t}/${id}`,{append_to_response:'similar'}),i=cur=norm(d,t),sv=S.wl.some(w=>w.id==i.id&&w.type==i.type);
  const meta=[i.year,'★ '+i.rating.toFixed(1),(d.runtime||d.episode_run_time?.[0])?(d.runtime||d.episode_run_time[0])+' min':'',d.number_of_seasons?d.number_of_seasons+' seasons':''].filter(Boolean).join('  ·  ');
  return `<div class="hero" style="height:55vh"><img src="${img(i.backdrop||i.poster,'w780')}" alt=""><a class="btn back" href="javascript:history.back()">Back</a></div><div style="position:relative;z-index:1;margin-top:-60px;padding:0 20px"><h1 style="font-size:38px">${esc(i.title)}</h1><p class="dim" style="margin:8px 0">${meta}</p><div style="margin:12px 0 18px">${d.genres.map(g=>`<span class="chip" style="cursor:default">${esc(g.name)}</span>`).join('')}</div>${playBtn(i)} <a class="btn" onclick="toggle()">${sv?'Remove from list':'Add to list'}</a><p style="margin-top:18px;color:rgba(255,255,255,.75)">${esc(i.overview)}</p></div>`+row('More like this',d.similar.results.map(r=>norm(r,t)).filter(x=>x.poster));
},
async library(){
  const t=D.lib||'w',body=t=='p'?(S.lib.items.length?plView():`<p class="empty">No playlist yet.<br><br><a class="btn p" href="#/settings">Add playlist</a></p>`):grid(t=='w'?S.wl:Object.values(S.pr).sort((a,b)=>b.u-a.u).map(p=>p.item),t=='w'?'Your watchlist is empty. Tap “Add to list” on any title.':'Nothing watched yet.');
  return `<div class="top"><h1>Library</h1><div style="margin:16px 0">${[['w','Watchlist'],['h','History'],['p','Playlist']].map(([k,l])=>`<a class="chip ${t==k?'on':''}" onclick="D.lib='${k}';route()">${l}</a>`).join('')}</div></div>${body}`;
},
async settings(){const s=S.src||{type:'xtream'},n=k=>S.lib.items.filter(x=>x.kind==k).length,m=s.type=='m3u';
return `<div class="top"><h1>Settings</h1></div><h2>Playlist</h2><div class="glass card" style="margin-top:0"><p class="dim" style="margin-bottom:10px">Movies and series only. Live channels are ignored.</p>
<select id="st" class="input" onchange="$('#xf').style.display=this.value=='xtream'?'block':'none';$('#mf').style.display=this.value=='xtream'?'none':'block'"><option value="xtream" ${m?'':'selected'}>Xtream Codes login</option><option value="m3u" ${m?'selected':''}>M3U playlist URL</option></select>
<div id="xf" style="display:${m?'none':'block'}"><input id="sv" class="input" placeholder="Server, e.g. http://host:8080" value="${esc(s.server)}"><input id="us" class="input" placeholder="Username" value="${esc(s.user)}"><input id="pw" class="input" type="password" placeholder="Password" value="${esc(s.pass)}"></div>
<div id="mf" style="display:${m?'block':'none'}"><input id="ul" class="input" placeholder="https://…/playlist.m3u" value="${esc(s.url)}"></div>
<p id="sm" class="dim" style="margin-bottom:12px">${S.lib.items.length?`${n('movie')} movies · ${n('series')} series · synced ${new Date(S.lib.t).toLocaleDateString()}`:'No playlist synced yet.'}</p>
<a class="btn p" onclick="addSrc(this)">Save and sync</a> <a class="chip" style="margin:8px 0 0" onclick="S.hideAdult=!S.hideAdult;DB.set('kv','adult',S.hideAdult);route()">${S.hideAdult?'Adult categories hidden':'Adult categories shown'}</a></div>
<h2>TMDB</h2><div class="glass card" style="margin-top:0"><p class="dim">API key (v3)</p><input id="k" class="input" value="${esc(S.key)}"><p class="dim">Fallback stream URL template</p><input id="t" class="input" value="${esc(S.tpl)}"><a class="btn p" onclick="saveSet(this)">Save changes</a></div><div style="padding:0 20px"><a class="btn" style="color:#fca5a5" onclick="wipe()">Erase all local data</a><p class="dim" style="text-align:center;margin-top:24px">VYRO 1.1 · Metadata by TMDB</p></div>`},
async onboarding(){return `<div class="ob"><div class="logo">VYRO</div><p class="dim" style="margin:8px 0 28px;max-width:280px">Connect your TMDB account to fill the app with movies and shows.</p><div class="glass card" style="margin:0"><input id="k" class="input" placeholder="TMDB API key (v3)" autocapitalize="off" autocorrect="off"><div id="e" class="err"></div><a class="btn p" style="width:100%;text-align:center" onclick="connect(this)">Connect TMDB</a><p style="margin-top:14px;text-align:center"><a class="dim" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Get a free key at themoviedb.org</a></p></div></div>`},
async watch(t,id){const i=norm(await api(`/${t}/${id}`),t);return player(S.tpl.replace('{type}',t).replace('{id}',id).replace('{season}',1).replace('{episode}',1),K(t,id),{...i,href:`#/watch/${t}/${id}`},null)},
async pl(k){
  const it=S.lib.items.find(x=>x.k==k);if(!it)return '<p class="empty">Title not found. Re-sync your playlist in Settings.</p>';
  cur=it;await loadEps(it);
  const tm=await api('/search/'+(it.kind=='series'?'tv':'movie'),{query:it.title}).then(r=>r.results[0]).catch(()=>null),sv=S.wl.some(w=>w.id==it.id&&w.type=='pl');
  let go=it.kind=='series'?(it.eps||[]).slice().sort((a,b)=>(S.pr[`pl:${k}:${b.id}`]?.u||0)-(S.pr[`pl:${k}:${a.id}`]?.u||0))[0]:null;
  const eps=Object.entries(Object.groupBy?Object.groupBy(it.eps||[],e=>e.s):(it.eps||[]).reduce((o,e)=>((o[e.s]=o[e.s]||[]).push(e),o),{}));
  return `<div class="hero" style="height:50vh"><img src="${img(tm?.backdrop_path,'w780')||img(it.poster)}" alt=""><a class="btn back" href="javascript:history.back()">Back</a></div><div style="position:relative;z-index:1;margin-top:-60px;padding:0 20px"><h1 style="font-size:36px">${esc(it.title)}</h1><p class="dim" style="margin:8px 0 16px">${esc(it.cat)}${tm?.vote_average?'  ·  ★ '+tm.vote_average.toFixed(1):''}</p>${it.kind=='movie'||go?`<a class="btn p" href="#/play/${k}${go?'/'+go.id:''}">${S.pr['pl:'+k+(go?':'+go.id:'')]?'Resume':'Play'}</a>`:''} <a class="btn" onclick="toggle()">${sv?'Remove from list':'Add to list'}</a><p style="margin-top:18px;color:rgba(255,255,255,.75)">${esc(tm?.overview)}</p></div>`
   +eps.map(([n,a],i)=>`<details class="glass" ${i?'':'open'}><summary>Season ${n}</summary>${a.map(e=>{const p=S.pr[`pl:${k}:${e.id}`];return `<a class="ep" href="#/play/${k}/${e.id}">${e.n}. ${esc(e.t||'Episode '+e.n)}${p?`<div class="bar"><i style="width:${p.t/p.d*100}%"></i></div>`:''}</a>`}).join('')}</details>`).join('');
},
async play(k,e){
  const it=S.lib.items.find(x=>x.k==k);await loadEps(it);let src=it.url,pk='pl:'+k,next=null,title=it.title;
  if(it.kind=='series'){const i=it.eps.findIndex(x=>x.id==e),ep=it.eps[i];src=ep.url;pk+=':'+e;title+=` S${ep.s}E${ep.n}`;if(it.eps[i+1])next=`#/play/${k}/${it.eps[i+1].id}`}
  const {eps,...slim}=it;return player(src,pk,{...slim,title,href:`#/play/${k}${e?'/'+e:''}`},next);
}};
/* Playlist engine */
const ADULT=/adult|xxx|18\+|porn|erotic|sex/i,nm=t=>(t||'').toLowerCase().replace(/\[.*?\]|\(.*?\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const mk=o=>({type:'pl',id:o.k,href:'#/pl/'+o.k,rating:0,added:0,cat:'Other',overview:'',year:'',...o});
const match=i=>{if(!S._m){S._m={};S.lib.items.forEach(x=>S._m[x.kind[0]+nm(x.title)]=x)}return S._m[(i.type=='tv'?'s':'m')+nm(i.title)]};
const playBtn=i=>{const m=match(i);return m?`<a class="btn p" href="${m.href}">Play from playlist</a>`:S.lib.items.length?`<span class="chip" style="margin:0 8px 0 0;cursor:default">Not in your playlist</span>`:`<a class="btn p" href="#/watch/${i.type}/${i.id}">Play</a>`};
const xapi=(a,q={})=>{const s=S.src;return fetch(`${s.server}/player_api.php?username=${encodeURIComponent(s.user)}&password=${encodeURIComponent(s.pass)}&action=${a}`+Object.entries(q).map(([k,v])=>`&${k}=${v}`).join('')).then(r=>r.json())};
async function loadEps(it){if(it.kind!='series'||it.eps)return;const s=S.src,d=await xapi('get_series_info',{series_id:it.sid});it.eps=[];for(const n in d.episodes)for(const e of d.episodes[n])it.eps.push({id:e.id,s:+n,n:+e.episode_num,t:e.title,url:`${s.server}/series/${s.user}/${s.pass}/${e.id}.${e.container_extension||'mp4'}`})}
async function sync(){
  const s=S.src,items=[];
  if(s.type=='xtream'){
    const [vc,v,sc,sr]=await Promise.all(['get_vod_categories','get_vod_streams','get_series_categories','get_series'].map(a=>xapi(a)));
    const cn=a=>Object.fromEntries(a.map(c=>[c.category_id,c.category_name])),vn=cn(vc),sn=cn(sc);
    v.forEach(x=>items.push(mk({k:'m'+x.stream_id,kind:'movie',title:x.name,poster:x.stream_icon,cat:vn[x.category_id]||'Other',rating:+x.rating||0,added:+x.added||0,url:`${s.server}/movie/${s.user}/${s.pass}/${x.stream_id}.${x.container_extension||'mp4'}`})));
    sr.forEach(x=>items.push(mk({k:'s'+x.series_id,kind:'series',sid:x.series_id,title:x.name,poster:x.cover,cat:sn[x.category_id]||'Other',rating:+x.rating||0,added:+x.last_modified||0})));
  }else{
    const txt=await(await fetch(s.url)).text(),ser={};let m=null,n=0;
    for(const l of txt.split(/\r?\n/)){
      if(l.startsWith('#EXTINF'))m={name:l.split(/,(.*)$/)[1]||'',logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1],cat:(l.match(/group-title="([^"]*)"/)||[])[1]||'Other'};
      else if(m&&l.trim()&&l[0]!='#'){const u=l.trim(),e=m.name.match(/^(.*?)\s*[-–]?\s*S(\d+)\s*E(\d+)/i);
        if(e||/\/series\//.test(u)){const t=e?e[1]:m.name,key=nm(t)+m.cat,x=ser[key]=ser[key]||mk({k:'x'+n++,kind:'series',title:t,poster:m.logo,cat:m.cat,eps:[]});x.eps.push({id:x.eps.length+1,s:e?+e[2]:1,n:e?+e[3]:x.eps.length+1,url:u})}
        else if(/\/movie\/|\.(mp4|m4v|mkv|mov|avi)(\?|$)/i.test(u))items.push(mk({k:'x'+n++,kind:'movie',title:m.name.replace(/\s*\(?\d{4}\)?$/,''),poster:m.logo,cat:m.cat,url:u,added:n}));
        m=null}}
    items.push(...Object.values(ser));
  }
  S.lib={items,t:Date.now()};S._m=null;DB.set('kv','lib',S.lib);
}
const addSrc=async b=>{const t=$('#st').value;S.src=t=='m3u'?{type:t,url:$('#ul').value.trim()}:{type:t,server:$('#sv').value.trim().replace(/\/+$/,''),user:$('#us').value.trim(),pass:$('#pw').value};b.textContent='Syncing…';try{await sync();DB.set('kv','src',S.src);route()}catch(e){b.textContent='Save and sync';$('#sm').innerHTML='<span class="err">Couldn’t load the playlist. Check the details. Your provider may also block browser access (CORS) or use http:// (blocked on https pages).</span>'}};
const libItems=()=>{const k=D.pt=='tv'?'series':'movie';let a=S.lib.items.filter(x=>x.kind==k&&!(S.hideAdult&&ADULT.test(x.cat)));if(D.cat)a=a.filter(x=>x.cat==D.cat);if(D.q)a=a.filter(x=>nm(x.title).includes(nm(D.q)));return a.sort(D.sort=='az'?(a,b)=>a.title.localeCompare(b.title):D.sort=='top'?(a,b)=>b.rating-a.rating:(a,b)=>b.added-a.added)};
const plGrid=()=>{const a=libItems(),n=D.n||90;return grid(a.slice(0,n),'No matches.')+(a.length>n?`<p style="text-align:center;margin-top:16px"><a class="btn" onclick="D.n=${n}+90;$('#pg').innerHTML=plGrid()">Show more</a></p>`:'')};
const plView=()=>{const k=D.pt=='tv'?'series':'movie',c=D.cats=[...new Set(S.lib.items.filter(x=>x.kind==k&&!(S.hideAdult&&ADULT.test(x.cat))).map(x=>x.cat))].sort().slice(0,80),ch=(on,fn,l)=>`<a class="chip ${on?'on':''}" onclick="${fn}">${esc(l)}</a>`;
  return `<div style="padding:0 20px">${ch(k=='movie',"setPl('pt','movie')",'Movies')}${ch(k=='series',"setPl('pt','tv')",'Series')} ${[['added','Recent'],['az','A–Z'],['top','Top rated']].map(([v,l])=>ch((D.sort||'added')==v,`setPl('sort','${v}')`,l)).join('')}<input class="input" placeholder="Filter this list" value="${esc(D.q)}" oninput="D.q=this.value;D.n=90;$('#pg').innerHTML=plGrid()"></div><div class="row" style="padding-bottom:14px">${c.map((x,i)=>ch(D.cat==x,`setPl('cat',D.cats[${i}])`,x)).join('')}</div><div id="pg">${plGrid()}</div>`};
const setPl=(k,v)=>{D[k]=k=='cat'&&D.cat==v?null:v;if(k=='pt')D.cat=null;D.n=90;route()};
const player=(src,pk,item,next)=>{const sv=S.pr[pk];
  after=()=>{const v=$('#v'),sp=[.75,1,1.25,1.5,2];let hls,last=0,si=1,qi=-1;
    const save=()=>{if(v.duration)S.pr[pk]={item,t:v.currentTime,d:v.duration,u:Date.now()},DB.set('pr',pk,S.pr[pk])};
    const msg=t=>{const e=$('#pe');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2500)};
    const fail=()=>msg('This stream could not be loaded. Check your playlist or stream URL in Settings.');
    const go=()=>{save();hls&&hls.destroy();location.replace(next)};
    if(!/\.(mp4|m4v|mov|mkv|avi)(\?|$)/i.test(src)&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(src);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,e)=>e.fatal&&fail())}else{v.src=src;v.onerror=fail}
    v.onloadedmetadata=()=>{if(sv&&sv.t<v.duration-30)v.currentTime=sv.t};
    v.ontimeupdate=()=>{if(Date.now()-last>5e3){last=Date.now();save()}};v.onpause=save;v.onended=()=>next?go():save();v.play().catch(()=>{});
    window.pc=k=>{
      if(k=='b')v.currentTime-=10;if(k=='f')v.currentTime+=10;if(k=='n')go();
      if(k=='s'){si=(si+1)%sp.length;v.playbackRate=sp[si];$('#ps').textContent=sp[si]+'×'}
      if(k=='c'){const t=[...v.textTracks].filter(x=>/subtitles|captions/.test(x.kind)),i=t.findIndex(x=>x.mode=='showing');t.forEach(x=>x.mode='disabled');if(!t.length)msg('No subtitles in this stream');else if(i+1<t.length){t[i+1].mode='showing';msg('Subtitles: '+(t[i+1].label||t[i+1].language||i+2))}else msg('Subtitles off')}
      if(k=='q'){if(!hls||!hls.levels.length)return msg('Single quality stream');qi=qi+1>=hls.levels.length?-1:qi+1;hls.currentLevel=qi;$('#pq').textContent=qi<0?'Auto':hls.levels[qi].height+'p'}};
    window.closePl=()=>{save();hls&&hls.destroy();history.back()}};
  return `<div id="pl"><video id="v" controls playsinline x-webkit-airplay="allow"></video><div class="pc glass"><a onclick="pc('b')">−10</a><a onclick="pc('f')">+10</a><a id="ps" onclick="pc('s')">1×</a><a onclick="pc('c')">CC</a><a id="pq" onclick="pc('q')">Auto</a>${next?`<a onclick="pc('n')">Next</a>`:''}</div><a class="btn back" onclick="closePl()">Close</a><p id="pe" class="glass card" style="display:none;position:absolute;bottom:18%;left:0;right:0;text-align:center"></p></div>`};
/* Actions */
const setD=t=>{D.type=t;D.g=null;route()},setG=g=>{D.g=D.g==g?null:g;route()};
let st;const doSearch=q=>{clearTimeout(st);st=setTimeout(async()=>{$('#res').innerHTML=q.trim()?grid(await list('/search/multi',null,{query:q,include_adult:false}),`No results for “${esc(q)}”.`):'<p class="empty">Search by title to find something to watch.</p>'},350)};
const toggle=()=>{const i=cur,has=S.wl.some(w=>w.id==i.id&&w.type==i.type);S.wl=has?S.wl.filter(w=>!(w.id==i.id&&w.type==i.type)):[i,...S.wl];has?DB.del('wl',K(i.type,i.id)):DB.set('wl',K(i.type,i.id),i);route()};
const connect=async b=>{const k=$('#k').value.trim();b.textContent='Checking key…';try{await api('/configuration',{},k);S.key=k;DB.set('kv','key',k);location.hash='#/'}catch{$('#e').textContent='TMDB rejected that key. Copy the v3 API key from your TMDB account settings.';b.textContent='Connect TMDB'}};
const saveSet=b=>{S.key=$('#k').value.trim();S.tpl=$('#t').value.trim();DB.set('kv','key',S.key);DB.set('kv','tpl',S.tpl);b.textContent='Saved'};
const wipe=async()=>{await Promise.all(ST.map(s=>DB.clear(s)));Object.assign(S,{key:'',tpl:DEF,wl:[],pr:{},lib:{items:[],t:0},src:null,_m:null});location.hash='#/onboarding'};
/* Router */
async function route(){
  const [a,b,c]=(location.hash.slice(2)||'').split('/');
  if(!S.key&&a!=='onboarding')return location.hash='#/onboarding';
  document.body.classList.toggle('bare',a==='onboarding'||a==='watch'||a==='play');
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.h===(a||'')));
  after=null;
  try{const fn=V[a||'home']||V.home;const h=await fn(b,c);app.className='page';app.innerHTML=h;if(a!=='discover'&&a!=='library')scrollTo(0,0);after&&after()}
  catch(e){app.innerHTML=`<p class="empty">Couldn’t load this screen. Check your connection and your TMDB key in Settings.<br><br><a class="btn" href="#/settings">Open settings</a></p>`}
}
addEventListener('hashchange',route);
(async()=>{try{const[k,t,w,p]=await Promise.all([DB.get('kv','key'),DB.get('kv','tpl'),DB.all('wl'),DB.all('pr')]);S.key=k||'';S.tpl=t||DEF;S.wl=w;S.pr=Object.fromEntries(p.map(x=>[K(x.item.type,x.item.id),x]))}catch{}try{S.lib=await DB.get('kv','lib')||S.lib;S.src=await DB.get('kv','src');S.hideAdult=(await DB.get('kv','adult'))!==false}catch{}route()})();
</script></body></html>
